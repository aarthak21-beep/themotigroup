<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Moti pearl gold M</title>
  <desc id="desc">A sculpted pearl-gold letter M with polished metallic highlights.</desc>
