      <stop offset="0" stop-color="#fff9df"/>
      <stop offset=".16" stop-color="#f4d98a"/>
      <stop offset=".34" stop-color="#b67c24"/>
      <stop offset=".49" stop-color="#fff0b4"/>
      <stop offset=".65" stop-color="#d4a447"/>
